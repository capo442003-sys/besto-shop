<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b7a3d" />
    <meta name="description" content="BESTO SHOP — Gestion boutique mode" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BESTO SHOP" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="application-name" content="BESTO SHOP" />
    <meta name="msapplication-TileColor" content="#1b7a3d" />
    <title>BESTO SHOP</title>
    <script>
      (function () {
        var ua = navigator.userAgent || '';
        var ios = /iPad|iPhone|iPod/.test(ua)
          || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var android = /Android/i.test(ua);
        var mobile = ios || android;
        var standalone = navigator.standalone === true;
        if (!standalone && window.matchMedia) {
          try {
            standalone = window.matchMedia('(display-mode: standalone)').matches
              || window.matchMedia('(display-mode: fullscreen)').matches
              || window.matchMedia('(display-mode: minimal-ui)').matches;
          } catch (e) {}
        }
        var root = document.documentElement;
        if (standalone) {
          root.classList.add('app-standalone');
          if (mobile) {
            root.classList.add('app-pwa-mobile');
            root.dataset.bmbPwa = 'mobile';
          } else {
            root.classList.add('app-desktop-pc');
            root.dataset.bmbPwa = 'desktop';
          }
          if (ios) root.classList.add('app-ios');
          if (android) root.classList.add('app-android');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" id="app-favicon" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/pwa-512x512.png" sizes="512x512" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
